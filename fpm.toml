[extra.ford]
project             = "ForCAD"
year                = "2023-2026"
summary             = '<p style="text-align: center"><img alt="ForCAD" src="https://github.com/gha3mi/forcad/raw/main/logo/logo.png" style="max-width: 100%; height: auto;"></p>'
project_github      = "https://github.com/gha3mi/forcad"
author              = "Seyed Ali Ghasemi"
email               = "info@gha3mi.com"
github              = "https://github.com/gha3mi"
license             = "BSD 3-Clause"
src_dir             = ["src", "example", "test"]
page_dir            = "docs/ford/pages"
output_dir          = "docs/ford/api"
source              = true
incl_src            = true
graph               = true
coloured_edges      = true
search              = true
print_creation_date = true
sort                = "permission-alpha"
display             = ["public", "private", "protected"]
favicon             = "logo/logo.png"


[extra.fortitude.check]
ignore = ["S001", "S061", "S081", "C003", "C061", "C051", "E001"]
per-file-ignores = { "src/forcad_nurbs_curve.F90" = ["C143", "C191"], "src/forcad_nurbs_surface.F90" = ["C143", "C191"], "src/forcad_nurbs_volume.F90" = ["C143", "C191"] }









