name: ForCAD CI

on:
  push:
    branches: [main, dev]
    paths-ignore: [README.md, CHANGELOG.md, LICENSE]
  pull_request:
    branches: [main, dev]
    paths-ignore: [README.md, CHANGELOG.md, LICENSE]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test_fpm:
    name: Core · ${{ matrix.os }} · ${{ matrix.environment }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, environment: gnu}
          - {os: ubuntu-latest, environment: intel}
          - {os: ubuntu-latest, environment: flang}
          - {os: macos-latest, environment: gnu}
          - {os: macos-15-intel, environment: gnu}
          - {os: windows-latest, environment: gnu}
          - {os: windows-latest, environment: intel}
          - {os: windows-latest, environment: flang}

    steps:
      - uses: actions/checkout@v6
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          environments: ${{ matrix.environment }}

      - name: Test Debug
        run: pixi run -e ${{ matrix.environment }} test --profile debug

      - name: Test Release
        if: success() || failure()
        run: pixi run -e ${{ matrix.environment }} test --profile release

  test_studio:
    name: Studio · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          environments: studio

      - name: Capture Home and both bundled projects
        shell: bash
        run: |
          pixi run start --preview home --size 1180 740 --screenshot build/ci-home.png
          pixi run start --project samples/chess.fcad --size 1180 740 --screenshot build/ci-chess.png
          pixi run start --project samples/head.fcad --size 1180 740 --screenshot build/ci-head.png
          test -s build/ci-home.png && test -s build/ci-chess.png && test -s build/ci-head.png

      - name: Build Studio Debug
        run: pixi run build-studio debug

  doc_ford:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    name: Generate FORD Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          environments: docs
      - name: Build and verify FORD documentation
        run: |
          pixi run docs
          test -s docs/ford/index.html
          test -s docs/ford/page/index.html
          test -s docs/ford/type/nurbs_curve.html
          test -s docs/ford/pagefind/pagefind.js
      - uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          branch: gh-pages
          folder: docs/ford
          commit-message: Deploy FORD docs

  linter_fortitude:
    name: Run Fortitude Linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          environments: lint
      - run: pixi run lint --output-format github
