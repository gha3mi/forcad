name: ForCAD CI

on:
  push:
    branches: [main, dev]
    paths-ignore: ['README.md','CHANGELOG.md','VERSION','LICENSE']
  pull_request:
    branches: [main, dev]
    paths-ignore: ['README.md','CHANGELOG.md','VERSION','LICENSE']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test_fpm:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    name: Core · ${{ matrix.os }} · ${{ matrix.environment }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest,   environment: default}
          - {os: ubuntu-latest,   environment: intel}
          - {os: ubuntu-latest,   environment: flang}
          - {os: windows-latest,  environment: default}
          - {os: windows-latest,  environment: intel}
          - {os: windows-latest,  environment: flang}
          - {os: macos-latest,    environment: default}
          - {os: macos-15-intel,  environment: default}

    steps:
      - uses: actions/checkout@v6
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          environments: ${{ matrix.environment }}

      - name: Test Debug
        run: pixi run -e ${{ matrix.environment }} test --profile debug

      - name: Test Release
        if: success() || failure()
        run: pixi run -e ${{ matrix.environment }} test --profile release

  test_studio:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    name: Studio · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          environments: studio

      - name: Capture Home and both bundled projects
        shell: bash
        run: |
          pixi run start --preview home --size 1180 740 --screenshot build/ci-home.png
          pixi run start --project samples/chess.fcad --size 1180 740 --screenshot build/ci-chess.png
          pixi run start --project samples/head.fcad --size 1180 740 --screenshot build/ci-head.png
          test -s build/ci-home.png && test -s build/ci-chess.png && test -s build/ci-head.png

      - name: Build Studio Debug
        run: pixi run build-studio debug

  doc_ford:
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip ci]') }}
    name: Generate FORD Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          environments: docs
      - run: pixi run docs
      - uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          branch: gh-pages
          folder: doc
          commit-message: Deploy FORD docs

  linter_fortitude:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    name: Run Fortitude Linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          environments: lint
      - run: pixi run lint --output-format github
